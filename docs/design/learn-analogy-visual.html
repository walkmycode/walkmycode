<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn: Watch it happen, drawn (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Mockup: "Watch it happen" as a drawn scene. The picture sits directly above the real thing, column
     for column, so what stands for what is a straight line down. Things are drawn, not written; what a
     step did is an arrow; the technical word for it is stamped as it happens. One text size (13px),
     square corners, dark graphite. Only transform and opacity move, × --m, so motion off is as clear. */
  :root { --bg:#1e1f22; --ui:#2b2d30; --ui-2:#35373c; --line:#43454a; --text:#dfe1e5; --dim:#9da0a8; --faint:#6f737a; --out:#17181a;
          --yellow:#f3d77a; --green:#a8e0a0; --pink:#f2a7a0; --blue:#9fd3f0; --m:1; }
  @media (prefers-reduced-motion: reduce) { :root { --m:0; } }
  :root[data-motion="off"] { --m:0; }
  * { box-sizing:border-box; border-radius:0; font-size:13px; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.5 Inter, system-ui, sans-serif; padding:clamp(8px, 1.4vw, 20px); }
  code, pre, kbd, .mono { font-family:"JetBrains Mono", Consolas, monospace; }
  p { margin:0; }
  .eyebrow { font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .btn { font:600 13px Inter; color:var(--text); background:var(--ui-2); border:1px solid var(--line); padding:5px 10px; cursor:pointer; }
  .btn.primary { background:var(--yellow); color:#22201a; border-color:transparent; }
  .btn[aria-pressed=true] { border-color:var(--yellow); color:var(--yellow); }
  .btn:disabled { opacity:.45; cursor:default; }
  kbd { border:1px solid var(--line); padding:0 4px; color:var(--dim); }
  .cell > svg.art { width:64px; height:64px; }

  .scene { border:1px solid var(--line); background:var(--ui); max-width:1680px; margin:0 auto; }
  .scene > header { display:flex; align-items:center; gap:12px; padding:9px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .scene > header b { color:var(--yellow); font-weight:650; } .scene > header .where { color:var(--dim); } .scene > header .sp { flex:1; }

  .stage { display:grid; grid-template-columns:minmax(0, 1.75fr) minmax(280px, 1fr); }
  .board { --side:.7fr; position:relative; padding:14px 16px 6px; min-width:0; }
  .side { border-left:1px solid var(--line); display:flex; flex-direction:column; min-width:0; }

  /* One grid for both rows and the ties between them: that is what lines a child up with its variable. */
  .row, .ties { display:grid; grid-template-columns:var(--cols); gap:10px; }
  .rowhead { display:flex; justify-content:space-between; gap:14px; margin-bottom:8px; } .rowhead span + span { text-align:right; }
  .cell { background:var(--ui-2); border:1.5px solid var(--line); padding:10px 8px 40px; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; text-align:center;
          transition:opacity calc(.3s * var(--m)), border-color calc(.2s * var(--m)); }
  .cell .name { font-weight:650; overflow-wrap:anywhere; } .row.r .cell .name { font-family:"JetBrains Mono", Consolas, monospace; color:var(--blue); }
  .cell .note { color:var(--faint); min-height:1.5em; }
  .cell.off { border-style:dashed; } .cell.off > svg, .cell.off .name { opacity:.45; } .cell.off .note { color:var(--pink); font-weight:600; }
  .cell.aside { background:transparent; border-color:transparent; color:var(--dim); }
  .cell.aside.stop { color:var(--pink); border-color:var(--pink); background:rgba(242,167,160,.07); }
  .cell.aside.stop .note { color:var(--pink); font-weight:650; }
  .cell.bin { border-style:dashed; background:transparent; color:var(--dim); }
  .cell.reach { border-color:var(--pink); }
  .slot { min-height:66px; display:flex; align-items:flex-start; justify-content:center; gap:6px; flex-wrap:wrap; }
  .thing { display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px 9px; border:1.5px solid var(--yellow); color:var(--yellow); background:rgba(243,215,122,.09);
           font-weight:650; white-space:nowrap; will-change:transform; }
  .thing svg.art { width:44px; height:44px; } .thing.ghost svg.art { opacity:.6; } .thing.was svg.art { filter:grayscale(1); opacity:.45; }
  .thing.ghost { border-style:dashed; border-color:var(--blue); color:var(--blue); background:rgba(159,211,240,.07); }
  .thing small { font-weight:500; color:var(--dim); }
  .thing.was { border-color:var(--line); color:var(--faint); background:none; text-decoration:line-through; }
  .thing[hidden] { display:none; }
  [data-id].lit { border-color:var(--yellow); box-shadow:0 0 0 1px var(--yellow); }

  .ties { height:46px; position:relative; }
  .ties i { justify-self:center; width:0; border-left:1.5px dotted var(--faint); position:relative; }
  .ties i::after { content:"="; position:absolute; top:50%; left:0; transform:translate(-50%, -50%); background:var(--ui); color:var(--faint); padding:0 5px; font-style:normal; font-weight:650; }
  .ties i.lit { border-color:var(--yellow); } .ties i.lit::after { color:var(--yellow); }
  .ties i.none { border:0; } .ties i.none::after { content:none; }
  .stamp { position:absolute; left:50%; top:50%; translate:-50% -50%; display:flex; gap:8px; align-items:center; padding:5px 12px; background:var(--out); border:1.5px solid var(--yellow);
           white-space:nowrap; z-index:2; }
  .stamp b { color:var(--yellow); font-weight:650; } .stamp code { color:var(--blue); font-weight:600; } .stamp[hidden] { display:none; }

  svg.links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  svg.links > path { fill:none; stroke-width:2; }
  svg.links text { font:600 12px Inter, sans-serif; text-anchor:middle; paint-order:stroke; stroke:var(--ui); stroke-width:5px; }

  /* The same scene as a UML sequence diagram: each holder is a lifeline, each hand-over a message. It is
     laid out by the same column grid, so no measuring: an arrow spans the columns it joins. */
  .board.as-seq > :not(.seq) { display:none; }
  .seq { --cols:repeat(var(--n), minmax(0, 1fr)); padding-left:28px; } .seq[hidden] { display:none; }
  .shead, .ev, .lifes { display:grid; grid-template-columns:var(--cols); gap:10px; }
  .shead > div { background:var(--ui-2); border:1.5px solid var(--line); padding:8px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; min-width:0; }
  .shead .pair { display:flex; align-items:center; gap:8px; color:var(--faint); font-weight:650; } .shead svg.art { width:48px; height:48px; } .shead svg.art + i + svg.art { width:34px; height:34px; }
  .shead .pair i { font-style:normal; } .shead b { font-weight:650; } .shead code { color:var(--blue); font-weight:600; }
  .srow { position:relative; padding:5px 0; cursor:pointer; transition:opacity calc(.25s * var(--m)), background-color calc(.2s * var(--m)); }
  .srow.later { opacity:.16; } .srow.now { background:rgba(243,215,122,.07); }
  .srow > .num { position:absolute; left:-24px; top:50%; translate:0 -50%; color:var(--faint); font-family:"JetBrains Mono", Consolas, monospace; } .srow.now > .num { color:var(--yellow); font-weight:600; }
  .lifes { position:absolute; inset:0; } .lifes i { justify-self:center; border-left:1.5px dashed var(--line); }
  .ev { position:relative; }
  .msg { position:relative; height:58px; --half:calc((100% - (var(--span) - 1) * 10px) / var(--span) / 2); color:var(--yellow); }
  .msg .lab { position:absolute; left:0; right:0; top:0; text-align:center; white-space:nowrap; }
  .lab b { font-weight:650; } .lab code { color:var(--blue); font-weight:600; } .msg .lab span { background:var(--ui); padding:0 6px; }
  .srow.now .msg .lab span { background:#33322d; }
  .wire { position:absolute; left:var(--half); right:var(--half); top:40px; border-top:2px solid currentColor; transform-origin:left; }
  .wire::after { content:""; position:absolute; right:-1px; top:-6px; border:5px solid transparent; border-left:9px solid currentColor; border-right:0; }
  .msg.rtl .wire { transform-origin:right; } .msg.rtl .wire::after { right:auto; left:-1px; border-left:0; border-right:9px solid currentColor; }
  .msg.loan { color:var(--blue); } .msg.loan .wire { border-top-style:dashed; }
  .rider { position:absolute; top:24px; right:calc(var(--half) + 14px); } .msg.rtl .rider { right:auto; left:calc(var(--half) + 14px); } .rider svg.art { width:30px; height:30px; }
  .ev .note { justify-self:center; display:flex; align-items:center; gap:6px; background:var(--out); border:1.5px solid var(--line); padding:3px 9px; margin:4px 0; white-space:nowrap; max-width:100%; overflow:hidden; color:var(--text); min-height:0; }
  .ev .note svg.art { width:26px; height:26px; } .ev .note b { font-weight:650; color:var(--yellow); } .ev .note code { color:var(--blue); font-weight:600; }
  .ev .note.end, .ev .note.stop { border-color:var(--pink); } .ev .note.end b, .ev .note.stop b { color:var(--pink); }

  pre { margin:0; background:var(--out); padding:10px 0; line-height:1.8; overflow:auto; border-bottom:1px solid var(--line); }
  pre .ln { display:block; padding:0 14px; border-left:3px solid transparent; color:var(--dim); white-space:pre; }
  pre .ln.now { border-left-color:var(--yellow); background:rgba(243,215,122,.09); color:var(--text); }
  pre .ln.now.bad { border-left-color:var(--pink); background:rgba(242,167,160,.1); }
  .side .eyebrow { padding:10px 14px 6px; }
  .words { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); border-top:1px solid var(--line); flex:1; align-content:start; }
  .word { background:var(--ui); border:0; border-bottom:1px solid var(--line); border-right:1px solid var(--line); color:var(--text); text-align:left; padding:8px 12px; cursor:pointer; display:grid; grid-template-columns:32px 1fr; gap:2px 10px; align-items:center; font:inherit;
          transition:background-color calc(.2s * var(--m)); }
  .word svg.art { width:30px; height:30px; grid-row:span 2; }
  .word .pair b { color:var(--yellow); font-weight:650; } .word .pair code { color:var(--blue); font-weight:600; }
  .word .why { color:var(--dim); }
  .word.now { background:rgba(243,215,122,.1); }
  .word.seen .pair::after { content:" ✓"; color:var(--green); }
  .word:hover { background:var(--ui-2); }

  .say { padding:11px 16px; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr 1fr; gap:28px; min-height:62px; }
  .foot { display:grid; grid-template-columns:auto 1fr 1fr; gap:18px; align-items:start; padding:11px 16px; border-top:1px solid var(--line); }
  .stepper { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .dots { display:flex; gap:4px; margin:0 6px; } .dots i { width:18px; height:4px; background:var(--line); cursor:pointer; } .dots i.on { background:var(--yellow); }
  .rule { border-left:3px solid var(--yellow); padding-left:10px; } .rule b { font-weight:650; }
  .breaks { border-left:3px solid var(--pink); padding-left:10px; color:var(--dim); }
  .keys { color:var(--faint); }

  @media (max-width: 980px) {
    .stage { grid-template-columns:1fr; } .side { border-left:0; border-top:1px solid var(--line); }
    .foot, .say { grid-template-columns:1fr; gap:10px; }
  }
  @media (max-width: 620px) {
    .row, .ties { gap:5px; } .cell { padding:8px 3px 38px; } .cell > svg.art { width:42px; height:42px; } .thing { padding:3px 5px; } .thing svg.art { width:30px; height:30px; }
    .cell.aside .note, .keys, .rowhead span + span, .shead svg.art + i, .shead svg.art + i + svg.art { display:none; }
    .ev .note { white-space:normal; flex-direction:column; gap:0; padding:2px 4px; text-align:center; } .seq { padding-left:18px; } .srow > .num { left:-16px; } .msg .lab { white-space:normal; }
    .board { --side:1fr; padding-inline:8px; } .cell.aside, .cell.bin { padding-inline:0; }
  }
</style>
</head>
<body>
<section class="scene" id="scene" aria-label="Analogy">
  <header>
    <span aria-hidden="true">💡</span><b id="title"></b><span class="where" id="where"></span><span class="sp"></span>
    <button class="btn" id="view" type="button" aria-pressed="false" title="The same scene drawn as a UML sequence diagram">Sequence diagram</button>
    <button class="btn" id="swap" type="button" title="Mockup only: the same view on a subject without code">Try another subject</button>
    <button class="btn" id="motion" type="button" aria-pressed="true" title="Mockup only: Settings → Motion">Motion</button>
    <button class="btn" type="button">Side panels</button><button class="btn" type="button">Close</button>
  </header>
  <div class="stage">
    <div class="board" id="board">
      <p class="eyebrow rowhead"><span>The picture</span><span id="place"></span></p>
      <div class="row a" id="rowA"></div>
      <div class="ties" id="ties"><div class="stamp" id="stamp" hidden></div></div>
      <p class="eyebrow rowhead"><span id="realHead"></span><span>the same thing, for real</span></p>
      <div class="row r" id="rowR"></div>
      <svg class="links" id="links" aria-hidden="true"></svg>
      <div class="seq" id="seq" hidden><div class="shead" id="shead"></div><div id="srows"></div></div>
    </div>
    <div class="side">
      <p class="eyebrow" id="codeHead"></p>
      <pre tabindex="0"><code id="code"></code></pre>
      <p class="eyebrow">The words, in the same picture</p>
      <div class="words" id="words"></div>
    </div>
  </div>
  <div class="say" aria-live="polite">
    <div><p class="eyebrow">In the picture</p><p id="sayA"></p></div>
    <div><p class="eyebrow" id="sayRHead"></p><p id="sayR"></p></div>
  </div>
  <div class="foot">
    <div class="stepper">
      <button class="btn" id="back" type="button" aria-label="Step back">◀</button>
      <button class="btn primary" id="play" type="button">▶ Play</button>
      <button class="btn" id="next" type="button">Step ▶</button>
      <span class="dots" id="dots"></span>
      <span class="keys"><kbd>←</kbd> <kbd>→</kbd> step · <kbd>Space</kbd> play</span>
    </div>
    <p class="rule"><span class="eyebrow">The rule</span><br><b id="rule"></b></p>
    <p class="breaks"><span class="eyebrow">Where the picture breaks</span><br><span id="breaks"></span></p>
  </div>
</section>

<script>
/* Mockup: the drawings for "Watch it happen" (sample sheet: learn-drawings.html; in use: learn-analogy-visual.html).
   Flat, softly shaded, in the manner of the professor's face. Each is a 64 × 64 SVG of plain shapes: no
   gradients, filters or images, so one is about 1 KB and costs the page almost nothing to draw or move.
   A drawing takes its main colour from --t (so one box is a toy box, a lunch box or a parcel), a person
   takes skin from --sk and hair from --hr, and a face or a checker has two states drawn in: .sad, .stop. */
const person = (shirt) => `<path class="d-t" d="M10 64v-7c0-10 9-17 22-17s22 7 22 17v7z"/>${shirt}`;
const eyes = (r) => `<ellipse class="d-ink" cx="26.5" cy="26" rx="${r}" ry="${r * 1.3}"/><ellipse class="d-ink" cx="37.5" cy="26" rx="${r}" ry="${r * 1.3}"/>`;
const cap = '<path class="d-hr" d="M18 25c-1-10 5-16 14-16s15 6 14 16c-2-5-6-8-14-8s-12 3-14 8z"/>';

const DRAWINGS = {
  child: { also: ["a pupil", "a friend", "you", "a player"], tint: "#f3d77a", svg:
    person('<rect class="d-sk2" x="28" y="33" width="8" height="10" rx="3"/><path class="d-t2" d="M24.5 41.5l7.5 7 7.5-7-3.500-1.500h-8z"/>') +
    '<g class="h-b"><circle class="d-hr" cx="15.5" cy="27" r="6"/><circle class="d-hr" cx="48.5" cy="27" r="6"/></g>' +
    '<circle class="d-sk" cx="32" cy="25" r="14"/>' +
    `<g class="h-a">${cap}</g><path class="d-hr h-b" d="M18 27c-2-12 5-18 14-18s16 6 14 18c-2-7-6-9-10-9-3 3-11 3-18 9z"/>` +
    '<g class="h-c d-hr"><circle cx="21.5" cy="15.500" r="6"/><circle cx="32" cy="12" r="7"/><circle cx="42.5" cy="15.500" r="6"/><circle cx="18" cy="22" r="4"/><circle cx="46" cy="22" r="4"/></g>' +
    eyes(1.8) + '<circle class="d-blush" cx="22.5" cy="31" r="2.600"/><circle class="d-blush" cx="41.5" cy="31" r="2.600"/>' +
    '<path class="d-line smile" d="M27 31.500q5 5 10 0"/><path class="d-line frown" d="M27.5 35q4.500-4 9 0"/>' },
  teacher: { also: ["a referee", "a judge", "a guard", "a librarian"], tint: "#7b7fb5", hair: "#9a9ca6", svg:
    person('<path class="d-w" d="M25 40h14l-7 13z"/><rect class="d-sk2" x="28" y="33" width="8" height="9" rx="3"/><path class="d-t2" d="M25.500 39.500l-5.500 3.500 10 14zM38.500 39.500l5.500 3.500-10 14z"/><circle class="d-y" cx="32" cy="46" r="2.200"/>') +
    '<circle class="d-hr" cx="32" cy="7.500" r="5.500"/><circle class="d-sk" cx="32" cy="25" r="14"/>' + cap + eyes(1.4) +
    '<g class="d-glass"><circle cx="26.5" cy="26" r="5"/><circle cx="37.5" cy="26" r="5"/><path d="M31.500 26h1"/></g>' +
    '<path class="d-line ok" d="M28 33.500q4 2 8 0"/><ellipse class="d-ink no" cx="32" cy="34.500" rx="2.600" ry="3"/><path class="d-line no" d="M20.500 17.500l7.500 3M43.500 17.500l-7.500 3"/>' },
  teddy: { also: ["a toy", "a favourite thing"], tint: "#c58d57", svg:
    '<circle class="d-t" cx="19" cy="13" r="6.500"/><circle class="d-t" cx="45" cy="13" r="6.500"/><circle class="d-t3" cx="19" cy="13" r="3.200"/><circle class="d-t3" cx="45" cy="13" r="3.200"/>' +
    '<ellipse class="d-t2" cx="16.500" cy="43" rx="5.500" ry="8.500" transform="rotate(24 16.500 43)"/><ellipse class="d-t2" cx="47.500" cy="43" rx="5.500" ry="8.500" transform="rotate(-24 47.500 43)"/>' +
    '<circle class="d-t2" cx="22" cy="57" r="6"/><circle class="d-t2" cx="42" cy="57" r="6"/><circle class="d-t3" cx="22" cy="57.500" r="3"/><circle class="d-t3" cx="42" cy="57.500" r="3"/>' +
    '<ellipse class="d-t" cx="32" cy="46" rx="13.500" ry="13"/><ellipse class="d-t3" cx="32" cy="48" rx="8" ry="8.500"/>' +
    '<circle class="d-t" cx="32" cy="24" r="13.500"/><ellipse class="d-t3" cx="32" cy="29.500" rx="6.500" ry="5.200"/>' +
    '<circle class="d-ink" cx="26.500" cy="21.500" r="1.700"/><circle class="d-ink" cx="37.500" cy="21.500" r="1.700"/><ellipse class="d-ink" cx="32" cy="27.500" rx="2.300" ry="1.700"/><path class="d-line thin" d="M32 29v2m-3 .2q3 2.600 6 0"/>' },
  box: { also: ["a toy box", "a chest", "a lunch box", "a bin", "a cupboard"], tint: "#c9935b", svg:
    '<path class="d-t2" d="M11 30l4-17h34l4 17z"/><circle class="d-pk" cx="22" cy="26" r="8"/><path class="d-w" d="M14.500 24q7.500-4 15 0v3q-7.500-4-15 0z"/>' +
    '<rect class="d-bl" x="33" y="17" width="13" height="13" rx="1.500" transform="rotate(12 39.500 23.500)"/><path class="d-y" d="M30 13l1.800 3.800 4.200.5-3.100 2.900.8 4.100-3.700-2-3.700 2 .8-4.100-3.100-2.900 4.200-.5z"/>' +
    '<rect class="d-t" x="8" y="30" width="48" height="27" rx="2.500"/><rect class="d-t2" x="8" y="40" width="48" height="4.500"/><rect class="d-y" x="28.500" y="36" width="7" height="11" rx="1.500"/><circle class="d-ink" cx="32" cy="42.500" r="1.300"/>' },
  drawer: { also: ["a variable", "a named box", "a pigeonhole", "a locker"], tint: "#5f86b3", svg:
    '<rect class="d-t2" x="7" y="8" width="50" height="50" rx="4"/><rect class="d-t" x="11" y="24" width="42" height="30" rx="2.500"/><rect class="d-t3" x="11" y="24" width="42" height="5" rx="2.500"/>' +
    '<rect class="d-w" x="18" y="12" width="28" height="8.500" rx="1.500"/><rect class="d-w2" x="21.500" y="15" width="13" height="2.500" rx="1.200"/><rect class="d-y" x="25" y="37" width="14" height="5" rx="2.500"/>' },
  memory: { also: ["a value", "data on the heap", "a row of cells"], tint: "#63c2a2", svg:
    '<rect class="d-w2" x="3" y="43" width="58" height="7" rx="2.500"/><path class="d-w2" d="M11 50v6M24 50v6M40 50v6M53 50v6" style="stroke:#c9cbd1;stroke-width:2.500;stroke-linecap:round"/>' +

    else if (now === "bin" && before && before !== "bin") out.push({ kind: "end", who: before, thing: t, ...(step.verb ?? { a: "gone", r: "gone" }) });
    else if (now && before && now !== before && now !== "bin") out.push({ kind: "msg", from: before, to: now, thing: t, ...(step.verb ?? { a: "passes", r: "passes" }) });
    for (const b of step.lent[t.id] ?? []) if (!(prev?.lent[t.id] ?? []).includes(b)) out.push({ kind: "msg", loan: true, from: now, to: b, thing: t, ...S.loan });
  }
  if (step.note) out.push({ kind: "note", ...step.note });
  if (step.stop) out.push({ kind: "stop", who: step.stop.who, a: step.stop.a, r: step.stop.r });
  return out;
}
function buildSeq() {
  const col = (id) => S.actors.findIndex((x) => x.id === id) + 1;
  $("seq").style.setProperty("--n", S.actors.length);
  $("shead").innerHTML = S.actors.map((x) => `<div data-id="${x.id}"><span class="pair">${ic(x.ia, x.oa)}<i>=</i>${ic(x.ir, x.or)}</span><b>${x.a}</b><code>${x.r}</code></div>`).join("");
  $("srows").innerHTML = S.steps.map((_, n) => `<div class="srow" data-srow="${n}"><span class="num">${n + 1}</span><div class="lifes">${S.actors.map(() => "<i></i>").join("")}</div>` + events(n).map((e) => {
    const lab = `<b>${e.a}</b> · <code>${e.r}</code>`;
    if (e.kind === "msg") {
      const a = col(e.from), b = col(e.to), lo = Math.min(a, b), hi = Math.max(a, b);
      return `<div class="ev"><div class="msg${a > b ? " rtl" : ""}${e.loan ? " loan" : ""}" style="grid-column:${lo} / ${hi + 1}; --span:${hi - lo + 1}"><span class="lab"><span>${lab}</span></span><span class="wire"></span><span class="rider">${ic(e.thing.ia, e.thing.oa)}</span></div></div>`;
    }
    return `<div class="ev"><div class="note ${e.kind}" style="grid-column:${col(e.who)}">${e.thing ? ic(e.thing.ia, e.thing.oa) : ""}<span>${e.kind === "end" ? "✕ " : ""}${lab}</span></div></div>`;
  }).join("") + "</div>").join("");
}

/** Who holds a thing at a step: a holder's id, "bin" once it is gone, or nothing before it exists. */
function holder(n, id) {
  for (let k = n; k >= 0; k--) { const h = S.steps[k].holds[id]; if (h !== undefined) return h === null ? "bin" : h; }
}
const slotOf = (side, who) => (who === "bin" ? document.querySelector(`[data-bin="${side}"] .slot`) : document.querySelector(`.cell[data-id="${who}"][data-side="${side}"] .slot`));

function render(animate = true) {
  const step = S.steps[i], scale = animate ? m() : 0;
  clearTimeout(drawT); $("links").innerHTML = "";
  // First, last, invert, play: a thing that changed hands glides there along a small arc.
  const from = new Map(Object.entries(things).map(([k, el]) => [k, el.isConnected && !el.hidden ? el.getBoundingClientRect() : null]));
  document.querySelectorAll(".ghost").forEach((g) => g.remove());
  for (const side of ["a", "r"]) {
    for (const t of S.things) {
      const el = things[side + ":" + t.id], who = holder(i, t.id);
      el.hidden = !who; el.classList.toggle("was", who === "bin");
      if (who) slotOf(side, who).append(el);
      for (const b of step.lent[t.id] ?? []) {
        const g = el.cloneNode(true);
        g.classList.add("ghost"); g.dataset.loan = side + ":" + t.id; g.insertAdjacentHTML("beforeend", "<small>on loan</small>");
        slotOf(side, b).append(g);
        if (scale) g.animate([{ opacity: 0, transform: "scale(.8)" }, { opacity: 1, transform: "none" }], { duration: 260 * scale, easing: "cubic-bezier(.22,1,.36,1)" });
      }
    }
    document.querySelectorAll(`.cell[data-side="${side}"]`).forEach((c) => {
      const off = step.off.includes(c.dataset.id);
      c.classList.toggle("off", off); c.querySelector("svg").classList.toggle("sad", off); c.classList.toggle("reach", step.stop?.who === c.dataset.id);
      c.querySelector(".note").textContent = off ? (side === "a" ? "empty-handed" : "cannot be used") : "";
    });
    const w = document.querySelector(`[data-watch="${side}"]`);
    if (w) { w.classList.toggle("stop", !!step.stop); w.querySelector("svg").classList.toggle("stop", !!step.stop); w.querySelector(".note").textContent = step.stop ? step.stop[side] : S.watcher[side === "a" ? "calmA" : "calmR"]; }
  }
  for (const [k, el] of Object.entries(things)) {
    const a = from.get(k); if (!a || el.hidden || !scale) continue;
    const b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
    el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: `translate(${dx / 2}px, ${dy / 2 - 22}px)`, offset: 0.5 }, { transform: "none" }], { duration: 520 * scale, easing: "cubic-bezier(.3,.7,.3,1)" });
  }
  if (step.stop && scale) document.querySelectorAll(".cell.reach").forEach((c) => c.animate([{ transform: "none" }, { transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "translateX(-3px)" }, { transform: "none" }], { duration: 360 * scale }));

  $("code").querySelectorAll(".ln").forEach((l, n) => { l.classList.toggle("now", n + 1 === step.line); l.classList.toggle("bad", !!step.stop); });
  $("sayA").textContent = step.a; $("sayR").textContent = step.r;
  const seen = new Set(S.steps.slice(0, i + 1).map((s) => s.word).filter((w) => w !== undefined));
  $("words").querySelectorAll(".word").forEach((w, n) => { w.classList.toggle("now", n === step.word); w.classList.toggle("seen", seen.has(n) && n !== step.word); });
  const stamp = $("stamp"), word = S.words[step.word];
  stamp.hidden = !word;
  if (word) {
    stamp.innerHTML = `<b>${word.a}</b> is <code>${word.r}</code>`;
    if (scale) stamp.animate([{ opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1 }], { duration: 300 * scale, delay: 380 * scale, fill: "backwards", easing: "cubic-bezier(.34,1.56,.64,1)" });
  }
  $("srows").querySelectorAll(".srow").forEach((r, n) => {
    r.classList.toggle("later", n > i); r.classList.toggle("now", n === i);
    if (n !== i || !scale || $("seq").hidden) return;
    r.querySelectorAll(".msg").forEach((msg) => {
      const wire = msg.querySelector(".wire"), far = (wire.getBoundingClientRect().width - 44) * (msg.classList.contains("rtl") ? 1 : -1);
      wire.animate([{ transform: "scaleX(0)" }, { transform: "none" }], { duration: 340 * scale, easing: "cubic-bezier(.2,.8,.2,1)" });
      msg.querySelector(".rider").animate([{ transform: `translateX(${far}px)` }, { transform: "none" }], { duration: 620 * scale, easing: "cubic-bezier(.3,.7,.3,1)" });
    });
    r.querySelectorAll(".note").forEach((x) => x.animate([{ opacity: 0, transform: "scale(.85)" }, { opacity: 1, transform: "none" }], { duration: 260 * scale, easing: "cubic-bezier(.34,1.56,.64,1)" }));
  });
  $("dots").querySelectorAll("i").forEach((d, n) => d.classList.toggle("on", n <= i));
  $("back").disabled = i === 0; $("next").disabled = i === S.steps.length - 1;
  $("play").textContent = timer ? "❚❚ Pause" : i === S.steps.length - 1 ? "↺ Replay" : "▶ Play";
  drawT = setTimeout(() => links(scale), 540 * scale);
}

/** What this step did, drawn once the things have landed: a move or a drop as an arrow, a loan as a thread. */
function links(scale) {
  const svg = $("links"), box = $("board").getBoundingClientRect(), step = S.steps[i];
  const at = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - box.left + r.width / 2, top: r.top - box.top, bottom: r.bottom - box.top, left: r.left - box.left, right: r.right - box.left, y: r.top - box.top + r.height / 2 }; };
  const marker = (c) => `<marker id="h-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--${c})" stroke="none"/></marker>`;
  let out = `<defs>${marker("yellow")}${marker("pink")}${marker("blue")}</defs>`;
  for (const side of ["a", "r"]) {
    for (const t of S.things) {
      const now = holder(i, t.id), before = i ? holder(i - 1, t.id) : undefined;
      if (now && before && now !== before) {
        const a = at(slotOf(side, before)), b = at(slotOf(side, now)), y = Math.max(a.bottom, b.bottom) + 4, c = now === "bin" ? "pink" : "yellow";
        out += `<path class="draw" d="M${a.x} ${y}Q${(a.x + b.x) / 2} ${y + 34} ${b.x} ${y}" stroke="var(--${c})" marker-end="url(#h-${c})"/>`;
        if (step.verb) out += `<text x="${(a.x + b.x) / 2}" y="${y + 30}" fill="var(--${c})">${step.verb[side]}</text>`;
      }
      document.querySelectorAll(`.ghost[data-loan="${side}:${t.id}"]`).forEach((g) => {
        const a = at(things[side + ":" + t.id]), b = at(g), ltr = a.x < b.x;
        out += `<path class="fade" d="M${ltr ? a.right + 2 : a.left - 2} ${a.y}L${ltr ? b.left - 4 : b.right + 4} ${a.y}" stroke="var(--blue)" stroke-dasharray="5 4" marker-end="url(#h-blue)"/>`;
        out += `<text class="fade" x="${((ltr ? a.right + b.left : a.left + b.right)) / 2}" y="${a.y - 7}" fill="var(--blue)">${S.loan[side]}</text>`;
      });
    }
  }
  svg.innerHTML = out;
  if (!scale) return;
  svg.querySelectorAll(".draw").forEach((p) => { const n = p.getTotalLength(); p.style.strokeDasharray = n; p.animate([{ strokeDashoffset: n }, { strokeDashoffset: 0 }], { duration: 320 * scale, easing: "ease-out" }); });
  svg.querySelectorAll(".fade, text").forEach((p) => p.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 * scale }));
}

function stop() { clearInterval(timer); timer = 0; }
function go(n) { stop(); i = Math.max(0, Math.min(S.steps.length - 1, n)); render(); }
function toggle() {
  if (timer) { stop(); return render(false); }
  if (i === S.steps.length - 1) i = -1;
  const tick = () => { if (i >= S.steps.length - 1) { stop(); return render(false); } i++; render(); };
  timer = setInterval(tick, 2600); tick();
}
$("back").onclick = () => go(i - 1); $("next").onclick = () => go(i + 1); $("play").onclick = toggle;
$("dots").onclick = (e) => e.target.dataset.step && go(+e.target.dataset.step);
$("words").onclick = (e) => { const w = e.target.closest(".word"); if (!w) return; const n = S.steps.findIndex((s) => s.word === +w.dataset.word); if (n >= 0) go(n); };
let which = 0;
$("swap").onclick = () => { stop(); build(SCENES[(which = 1 - which)]); };
$("view").onclick = (e) => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", on); $("seq").hidden = !on; $("board").classList.toggle("as-seq", on); render(false);
};
$("srows").onclick = (e) => { const r = e.target.closest(".srow"); if (r) go(+r.dataset.srow); };
$("motion").onclick = (e) => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", on); document.documentElement.dataset.motion = on ? "on" : "off"; };
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(i + 1); else if (e.key === "ArrowLeft") go(i - 1); else if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); toggle(); }
});
// Pointing at a holder or a thing lights its counterpart in the other row, and the line between them.
const light = (e, on) => { const el = e.target.closest?.("[data-id]"); if (!el) return; document.querySelectorAll(`[data-id="${el.dataset.id}"], [data-tie="${el.dataset.id}"]`).forEach((x) => x.classList.toggle("lit", on)); };
for (const [ev, on] of [["mouseover", true], ["mouseout", false], ["focusin", true], ["focusout", false]]) $("board").addEventListener(ev, (e) => light(e, on));
new ResizeObserver(() => { clearTimeout(drawT); drawT = setTimeout(() => links(0), 60); }).observe($("board"));
build(SCENES[0]);
</script>
</body>
</html>
