# Three services and the two boxes they share.
services:
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      USERS_URL: http://users:8080
      ORDERS_URL: http://orders:8000
  users:
    build: ./services/users
    ports:
      - "8000:8080"
    environment:
      - DATABASE_URL=postgres://app:pw@postgres:5432/shop
    depends_on:
      - postgres
      - kafka
  orders:
    build: ./services/orders
    ports:
      - "9000:9000"
    environment:
      USERS_URL: http://users:8080
      DATABASE_URL: postgres://app:pw@postgres:5432/shop
      KAFKA_BROKERS: kafka:9092
      PAYMENTS_URL: http://payments:9000
    depends_on:
      - postgres
      - kafka
  postgres:
    image: postgres:16
  kafka:
    image: redpandadata/redpanda:latest
