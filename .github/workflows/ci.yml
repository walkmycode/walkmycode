# Checks every pull request to main, on Linux and Windows, and runs when
# started by hand (Actions → CI → Run workflow). Not on every push: the repo is
# private and Windows minutes count double (Linux 1×, Windows 2×).
#
# No macOS, by the owner's decision (Oct 2026): WalkMyCode is Windows and Linux
# until there is demand for a Mac version. Don't add macOS runners here.
name: CI

# Runners: GitHub's by default. Until 1 Dec 2026 the org's free Actions minutes are spent, so the repo
# variables RUNS_ON_LINUX / RUNS_ON_WINDOWS (JSON label lists, e.g. ["self-hosted","wmc-linux"]) send
# the jobs to our own runners (docs/DESKTOP.md, "Self-hosted runners"). Delete the variables to go back.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ${{ vars.RUNS_ON_LINUX || '"ubuntu-latest"' }}
          - os: windows-latest
            runner: ${{ vars.RUNS_ON_WINDOWS || '"windows-latest"' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    # Our own Windows runner (the owner's PC, RUNS_ON_WINDOWS) can take 20 minutes over the install alone, and
    # 45 cut it off before the sweeps; GitHub's runners keep 45.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && vars.RUNS_ON_WINDOWS && 75 || 45 }}
    steps:
      # Files exactly as the repository stores them. Windows runners default to
      # core.autocrlf=true, which rewrites the test fixtures' line endings (a
      # developer's clone here doesn't).
      - name: Line endings as stored
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Not on our own Windows runner: packing the npm cache there (tar, in the closing step) never
          # finished, so the job passed every step and was then cut off at its time limit, with nothing saved
          # for the next run either.
          # (Written this way round because an empty result cannot be the middle of "a && b || c".)
          cache: ${{ !(matrix.os == 'windows-latest' && vars.RUNS_ON_WINDOWS) && 'npm' || '' }}

      # No audit: it fetched whole registry listings (next, katex) and took up to 9 minutes of a
      # 20-minute install on our own Windows runner. Run `npm audit` on its own when wanted.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Quoted so the test runner, not the shell, expands the glob (the same on every OS).
      - name: Tests
        run: npx tsx --conditions=react-server --test --test-concurrency=2 "tests/**/*.test.ts"

      - name: Build the MCP server and plugin
        run: npm run build:mcp

      - name: MCP smoke test (stdio, like an AI app)
        run: npm run smoke:mcp

      # The real page in headless Chrome against the real server. GitHub's Linux,
      # macOS and Windows runners all come with Chrome installed.
      - name: MCP end-to-end
        run: npm run e2e:mcp
      # Every control on the page clicked, then again with the server stopped (mcp/sweep.mjs).
      - name: MCP sweep of every control
        run: npm run sweep:mcp
      # The same for the full app: every room, panel and setting, a phone, and the server stopped (scripts/sweep-app.mjs).
      - name: App sweep of every control
        run: npm run sweep:app
